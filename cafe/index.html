<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="밤에 여는 작은 카페, 달빛카페의 메뉴판입니다.">
    <title>달빛카페 — 메뉴</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <!-- 헤더: 로고, 한 줄 소개, 상단 메뉴 -->
    <header class="site-header" id="top">
      <h1 class="logo"><a href="#top">달빛카페</a></h1>
      <p class="tagline">하루 끝, 달빛 아래 쉬어 가는 작은 카페</p>

      <nav class="site-nav" aria-label="메뉴 바로가기">
        <ul>
          <li><a href="#signature">시그니처</a></li>
          <li><a href="#coffee">커피</a></li>
          <li><a href="#non-coffee">논커피</a></li>
          <li><a href="#dessert">디저트</a></li>
          <li><a href="#info">안내</a></li>
        </ul>
      </nav>
    </header>

    <!-- 구역 전환: JavaScript 없이 CSS :target으로 동작
         처음에는 시그니처만 보이고, 상단 메뉴를 누르면 그 구역만 보인다 -->
    <main>
      <!-- 시그니처: 대표 메뉴 4개 (3단계에서 채움) -->
      <section class="menu-section" id="signature" aria-labelledby="signature-title">
        <h2 id="signature-title">시그니처</h2>
      </section>

      <!-- 커피: 6종 + 디카페인 안내 (3단계에서 채움) -->
      <section class="menu-section" id="coffee" aria-labelledby="coffee-title">
        <h2 id="coffee-title">커피</h2>
      </section>

      <!-- 논커피 · 티: 라떼 / 에이드 / 티 (3단계에서 채움) -->
      <section class="menu-section" id="non-coffee" aria-labelledby="non-coffee-title">
        <h2 id="non-coffee-title">논커피 · 티</h2>

        <h3>라떼</h3>

        <h3>에이드</h3>

        <h3>티</h3>
      </section>

      <!-- 디저트: 3종 (3단계에서 채움) -->
      <section class="menu-section" id="dessert" aria-labelledby="dessert-title">
        <h2 id="dessert-title">디저트</h2>
      </section>

      <!-- 매장 안내: 영업시간, 휴무, 위치 (3단계에서 채움) -->
      <section class="info-section" id="info" aria-labelledby="info-title">
        <h2 id="info-title">매장 안내</h2>
      </section>
    </main>

    <!-- 푸터: 카페 이름, 저작권 표기 -->
    <footer class="site-footer">
      <p>달빛카페</p>
      <p><small>&copy; 2026 달빛카페. 웹프로그래밍 실습용 가상 카페입니다.</small></p>
      <p class="photo-credit"><small>배경 사진: <a href="https://unsplash.com/photos/jJ_CskRaG3g" target="_blank" rel="noopener noreferrer">Aron Visuals, Unsplash</a></small></p>
    </footer>
  </body>
</html>
